# =============================================================
# Nginx 配置 —— 单容器版（云托管部署）
#
# 与 doc_translation_website/nginx.conf 的区别：
#   proxy_pass 目标从 http://backend:8080（docker-compose 内部 DNS）
#              改为 http://localhost:8080（同一容器内的 Spring Boot）
# =============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip 压缩 ────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── API 反向代理 → 同容器内 Spring Boot ──────────────────
    location /api/ {
        proxy_pass http://localhost:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout  10s;

        client_max_body_size 10m;
    }

    # ── SPA 路由处理 ─────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 静态资源长效缓存（Vite 产物文件名含 hash）──────────────
    location ~* \.(js|css|woff2?|ttf|eot|otf|ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── 安全响应头 ────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"         always;
    add_header X-Frame-Options         "SAMEORIGIN"      always;
    add_header X-XSS-Protection        "1; mode=block"   always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # ── 错误页 ───────────────────────────────────────────────
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
