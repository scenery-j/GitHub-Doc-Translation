# =============================================================
# Supervisord 配置 —— 单容器四进程管理
#
# 启动顺序（priority 从小到大先启动）：
#   priority=5  postgres  → 数据库，最先启动
#   priority=6  redis     → 缓存，数据库之后
#   priority=10 nginx     → Web 服务器（后端未就绪时返回 502，不影响启动）
#   priority=20 backend   → Spring Boot，由 start-backend.sh 等待 PG+Redis 就绪
#
# 任意进程崩溃时自动重启（autorestart=true）
# 所有日志输出到 stdout/stderr，与 docker logs 直接对接
# =============================================================

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

# ── PostgreSQL 16 ────────────────────────────────────────────
# 直接调用 postgres 二进制（不用 pg_ctlcluster），supervisord 管理生命周期
[program:postgres]
command=/usr/lib/postgresql/16/bin/postgres \
    -D /var/lib/postgresql/16/main \
    -c config_file=/etc/postgresql/16/main/postgresql.conf
user=postgres
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=5

# ── Redis ────────────────────────────────────────────────────
# --daemonize no 保持前台运行，supervisord 才能监控进程状态
[program:redis]
command=/usr/bin/redis-server \
    --daemonize no \
    --appendonly yes \
    --loglevel warning \
    --bind 127.0.0.1
user=redis
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=6

# ── Nginx（前台模式）────────────────────────────────────────
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

# ── Spring Boot 后端 ─────────────────────────────────────────
# 由 start-backend.sh 包装，内部等待 PG + Redis 就绪后再启动 JVM
[program:backend]
command=/app/start-backend.sh
directory=/app
user=appuser
autostart=true
autorestart=true
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
