# =============================================================
# Nginx 配置 — doc_translation_website
#
# 职责：
#   1. 提供 Vue 3 SPA 静态文件（dist/）
#   2. 把 /api/* 请求反向代理到后端服务（backend:8080）
#   3. 处理 SPA 路由：所有非静态资源请求都返回 index.html
# =============================================================

server {
    listen 80;
    server_name _;          # 匹配任意域名，生产可替换为具体域名

    # 静态文件根目录（对应 Dockerfile 中 COPY 的目标路径）
    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip 压缩 ───────────────────────────────────────────
    # 减少传输体积，提升页面加载速度
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;           # 小于 1KB 的文件不压缩（压缩开销大于收益）
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── API 反向代理 ─────────────────────────────────────────
    # 所有 /api/ 开头的请求转发给后端容器
    # "backend" 是 docker-compose 中后端服务的名称，Docker 内部 DNS 自动解析
    location /api/ {
        proxy_pass http://backend:8080;

        # 传递真实客户端信息给后端（日志、限流、安全判断需要）
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 翻译任务可能耗时较长，设置较宽松的超时时间
        proxy_read_timeout    300s;   # 等待后端响应最多 5 分钟
        proxy_send_timeout    300s;
        proxy_connect_timeout  10s;   # 建立连接超时 10 秒

        # 支持较大的请求体（上传配置文件等场景）
        client_max_body_size 10m;
    }

    # ── GitHub OAuth 回调路由 ────────────────────────────────
    # /api/auth/github/callback 由后端处理，已被上面的 /api/ 规则覆盖

    # ── SPA 路由处理 ─────────────────────────────────────────
    # Vue Router 使用 HTML5 History 模式，刷新页面时 Nginx 需要返回 index.html
    # try_files 逻辑：
    #   $uri       → 先尝试按 URL 找实际文件（如 /assets/main.js）
    #   $uri/      → 再尝试按 URL 找目录（如 /about/）
    #   /index.html → 都找不到时返回 index.html，由 Vue Router 接管路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 静态资源缓存 ─────────────────────────────────────────
    # Vite 构建的 JS/CSS 文件名带有内容 hash（如 main.a1b2c3d4.js）
    # 内容不变则文件名不变，可以永久缓存
    location ~* \.(js|css|woff2?|ttf|eot|otf|ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # 关闭访问日志，减少磁盘 I/O
        access_log off;
    }

    # ── 安全响应头 ────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"         always;
    add_header X-Frame-Options         "SAMEORIGIN"      always;
    add_header X-XSS-Protection        "1; mode=block"   always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # ── 错误页 ───────────────────────────────────────────────
    error_page 404 /index.html;    # 404 也交给 Vue Router 处理
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
